name: Sync and deploy store

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Read public storefront fields and download changed images
        run: node scripts/sync-static-content.mjs
        env:
          PUBLIC_DIR: .
          GENERATED_DIR: "false"
      - name: Build stable Karambaby cutouts
        run: python scripts/build-karambaby-cutouts.py --public-dir .
      - name: Straighten sideways and tiny product photos
        run: python scripts/fix-catalog-photos.py --public-dir .
      - name: Measure photo backdrops for seamless product tiles
        run: python scripts/build-image-tones.py --public-dir .
      - name: Build light card previews
        run: python scripts/build-thumbs.py --public-dir .
      - name: Refresh fashion headlines
        run: node scripts/update-fashion-news.mjs fashion-news.json
      - name: Publish refreshed content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data catalog-images catalog-cutouts catalog-thumbs fashion-news.json
          git diff --cached --quiet || git commit -m "Refresh store content"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Update fashion news

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: update-fashion-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the latest fashion headlines
        run: node scripts/update-fashion-news.mjs fashion-news.json
      - name: Publish changed headlines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fashion-news.json
          git diff --cached --quiet || git commit -m "Update fashion news"
          git push

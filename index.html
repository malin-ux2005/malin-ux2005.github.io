      // so the product card then opened half off-screen. maximum-scale stops that automatic
      // zoom; iOS still lets people pinch-zoom. Other platforms keep the plain viewport.

        var ua = navigator.userAgent;
        var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      })();
